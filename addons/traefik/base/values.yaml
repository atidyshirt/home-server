# Gateway API implementation, replacing envoy-gateway: Envoy's bundled TCMalloc
# assumes a 48-bit virtual address space and hard-crashes on this Pi's 39-bit-VA
# aarch64 kernel (not fixable via config — it's a compile-time constant in the
# binary). Traefik is written in Go and doesn't have this problem.
#
# Runs hostNetwork on the node's LAN IP, same as envoy-gateway was meant to, so
# LAN hostnames resolve on plain port 80 with no extra port in the browser.
# Single-node cluster, no MetalLB.

deployment:
  replicas: 1
  dnsPolicy: ClusterFirstWithHostNet

hostNetwork: true

ports:
  # hostNetwork means every entrypoint binds directly to the node's ports — the
  # chart's default 8080 for the internal traefik/dashboard/ping entrypoint
  # collides with kube-router's metrics endpoint, which already owns 8080 here.
  traefik:
    port: 9000
  web:
    port: 80

# Binding port 80 as non-root (uid 65532) with just CAP_NET_BIND_SERVICE added back
# didn't work on this system — same "permission denied" with or without
# allowPrivilegeEscalation: true, pointing at something broken in capability
# granting below the Kubernetes API, not a manifest issue. Running as root
# sidesteps it entirely; also drops the capability restriction rather than
# relying on the same broken mechanism while root.
securityContext:
  capabilities:
    drop: []

podSecurityContext:
  runAsNonRoot: false
  runAsUser: 0
  runAsGroup: 0

providers:
  kubernetesGateway:
    enabled: true

gateway:
  name: lan-gateway
  listeners:
    web:
      port: 80
      # Default restricts routes to the Gateway's own namespace; apps/addons
      # live in their own namespaces (argocd, applications/*), so allow all.
      namespacePolicy:
        from: All

gatewayClass:
  name: traefik
