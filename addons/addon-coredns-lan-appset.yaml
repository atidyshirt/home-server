apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addon-coredns-lan
  namespace: argocd
spec:
  # See addon-traefik-appset.yaml: repoURL/targetRevision come from the
  # `in-cluster` Secret's annotations, set by Pulumi.
  generators:
    - clusters: {}
  template:
    metadata:
      name: coredns-lan
    spec:
      project: default
      source:
        repoURL: '{{metadata.annotations.addons_repo_url}}'
        targetRevision: '{{metadata.annotations.addons_repo_revision}}'
        path: addons/coredns-lan/base
      destination:
        server: https://kubernetes.default.svc
        namespace: coredns-lan
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
