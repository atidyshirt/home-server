apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addon-argo-workflows
  namespace: argocd
spec:
  generators:
    - clusters: {}
  template:
    metadata:
      name: argo-workflows
    spec:
      project: platform
      info:
        - name: Web
          value: 'argo-workflows.{{metadata.annotations.addons_domain}}'
        - name: Documentation
          value: https://argo-workflows.readthedocs.io/
        - name: Source Code
          value: https://github.com/argoproj/argo-workflows
      source:
        repoURL: '{{metadata.annotations.addons_repo_url}}'
        targetRevision: '{{metadata.annotations.addons_repo_revision}}'
        path: applications/argo-workflows/base
        kustomize:
          commonAnnotations:
            addons_domain: '{{metadata.annotations.addons_domain}}'
            addons_node_ip: '{{metadata.annotations.addons_node_ip}}'
            addons_node_ip_v6: '{{metadata.annotations.addons_node_ip_v6}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: argo-workflows
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
