apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addon-traefik
  namespace: argocd
spec:
  generators:
    - clusters: {}
  template:
    metadata:
      name: traefik
    spec:
      project: default
      source:
        repoURL: '{{metadata.annotations.addons_repo_url}}'
        targetRevision: '{{metadata.annotations.addons_repo_revision}}'
        path: applications/traefik/base
      destination:
        server: https://kubernetes.default.svc
        namespace: traefik
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
