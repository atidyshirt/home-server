apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addon-traefik
  namespace: argocd
spec:
  generators:
    - clusters: {}
  template:
    metadata:
      name: traefik
    spec:
      project: platform
      info:
        - name: Documentation
          value: https://doc.traefik.io/traefik/
        - name: Source Code
          value: https://github.com/traefik/traefik
      source:
        repoURL: '{{metadata.annotations.addons_repo_url}}'
        targetRevision: '{{metadata.annotations.addons_repo_revision}}'
        path: applications/traefik/base
        kustomize:
          commonAnnotations:
            addons_domain: '{{metadata.annotations.addons_domain}}'
            addons_node_ip: '{{metadata.annotations.addons_node_ip}}'
            addons_node_ip_v6: '{{metadata.annotations.addons_node_ip_v6}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: traefik
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
