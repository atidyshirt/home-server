apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addon-argo-events
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          matchLabels:
            platform.stack.enabled: "true"
  template:
    metadata:
      name: argo-events
    spec:
      project: platform
      info:
        - name: Documentation
          value: https://argoproj.github.io/argo-events/
        - name: Source Code
          value: https://github.com/argoproj/argo-events
      source:
        repoURL: '{{metadata.annotations.addons_repo_url}}'
        targetRevision: '{{metadata.annotations.addons_repo_revision}}'
        path: applications/argo-events/base
        kustomize:
          commonAnnotations:
            addons_domain: '{{metadata.annotations.addons_domain}}'
            addons_node_ip: '{{metadata.annotations.addons_node_ip}}'
            addons_node_ip_v6: '{{metadata.annotations.addons_node_ip_v6}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: argo-events
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
