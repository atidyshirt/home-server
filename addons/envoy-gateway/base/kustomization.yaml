apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  # Kustomize appends `name` onto `repo` for OCI charts, so `repo` must be the
  # *parent* path (docker.io/envoyproxy), not the full chart path — otherwise it
  # requests docker.io/envoyproxy/gateway-helm/gateway-helm, which 401s.
  - name: gateway-helm
    repo: oci://docker.io/envoyproxy
    version: v1.9.0
    releaseName: eg
    namespace: envoy-gateway-system
    includeCRDs: true

resources:
  - gateway.yaml
