apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addon-onepassword-operator
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          matchLabels:
            platform.stack.enabled: "true"
  template:
    metadata:
      name: onepassword-operator
    spec:
      project: platform
      info:
        - name: Documentation
          value: https://developer.1password.com/docs/k8s/k8s-operator/
        - name: Source Code
          value: https://github.com/1Password/onepassword-operator
      source:
        repoURL: '{{metadata.annotations.addons_repo_url}}'
        targetRevision: '{{metadata.annotations.addons_repo_revision}}'
        path: applications/onepassword-operator/base
        kustomize:
          commonAnnotations:
            addons_domain: '{{metadata.annotations.addons_domain}}'
            addons_node_ip: '{{metadata.annotations.addons_node_ip}}'
            addons_node_ip_v6: '{{metadata.annotations.addons_node_ip_v6}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: onepassword
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
