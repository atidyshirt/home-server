apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addon-applications
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - clusters: {}
          - git:
              repoURL: '{{metadata.annotations.addons_repo_url}}'
              revision: '{{metadata.annotations.addons_repo_revision}}'
              directories:
                - path: applications/*/base
                - path: applications/traefik/base
                  exclude: true
                - path: applications/coredns-lan/base
                  exclude: true
                - path: applications/onepassword-operator/base
                  exclude: true
  template:
    metadata:
      name: '{{path[1]}}'
    spec:
      project: default
      source:
        repoURL: '{{metadata.annotations.addons_repo_url}}'
        targetRevision: '{{metadata.annotations.addons_repo_revision}}'
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{path[1]}}'
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
