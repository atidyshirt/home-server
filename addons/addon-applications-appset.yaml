apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addon-applications
  namespace: argocd
spec:
  # Matrix of clusters (for repoURL/revision, from the `in-cluster` Secret's
  # annotations set by Pulumi — see addon-traefik-appset.yaml) x git directories
  # (for auto-discovering applications/*/base). The git generator's own
  # repoURL/revision are templated from the clusters generator's output too, so
  # a pinned branch affects which commit gets scanned for app directories, not
  # just which commit each discovered app is deployed from.
  generators:
    - matrix:
        generators:
          - clusters: {}
          - git:
              repoURL: '{{metadata.annotations.addons_repo_url}}'
              revision: '{{metadata.annotations.addons_repo_revision}}'
              directories:
                - path: applications/*/base
  template:
    metadata:
      name: '{{path[1]}}'
    spec:
      project: default
      source:
        repoURL: '{{metadata.annotations.addons_repo_url}}'
        targetRevision: '{{metadata.annotations.addons_repo_revision}}'
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{path[1]}}'
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
