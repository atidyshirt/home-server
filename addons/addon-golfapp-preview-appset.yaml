apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addon-golfapp-preview
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  golfapp-preview.stack.enabled: "true"
          - pullRequest:
              github:
                owner: atidyshirt
                repo: golf-ai-experiment
                labels:
                  - preview
                tokenRef:
                  secretName: golfapp-preview-github-token
                  key: token
  template:
    metadata:
      name: 'golf-pr-{{number}}'
      annotations:
        argocd.argoproj.io/compare-options: ServerSideDiff=true
      labels:
        app.kubernetes.io/part-of: golfapp-preview
    spec:
      project: golf-application
      info:
        - name: Web
          value: 'golf-pr-{{number}}.{{metadata.annotations.addons_domain}}'
        - name: Pull Request
          value: '{{html_url}}'
        - name: Source Code
          value: https://github.com/atidyshirt/golf-ai-experiment
        - name: Deployment
          value: https://github.com/atidyshirt/golfapp-platform
      source:
        repoURL: https://github.com/atidyshirt/golfapp-platform
        targetRevision: main
        path: deploy/preview
        kustomize:
          images:
            - 'ghcr.io/atidyshirt/golfapp-api:{{head_sha}}'
            - 'ghcr.io/atidyshirt/golfapp-web:{{head_sha}}'
          patches:
            - target:
                kind: HTTPRoute
                name: golfapp-web
              patch: |-
                - op: replace
                  path: /spec/hostnames/0
                  value: 'golf-pr-{{number}}.{{metadata.annotations.addons_domain}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'golf-pr-{{number}}'
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        managedNamespaceMetadata:
          labels:
            app.kubernetes.io/part-of: golfapp-preview
