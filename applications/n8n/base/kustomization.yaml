apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: n8n
    repo: https://community-charts.github.io/helm-charts
    version: 1.24.43
    releaseName: n8n
    namespace: n8n
    valuesFile: values.yaml
    includeCRDs: true

resources:
  - onepassword-items.yaml
  - httproute.yaml

replacements:
  - source:
      kind: HTTPRoute
      name: n8n
      fieldPath: metadata.annotations.addons_domain
    targets:
      - select:
          kind: HTTPRoute
          name: n8n
        fieldPaths:
          - spec.hostnames.0
        options:
          delimiter: '.'
          index: 1
