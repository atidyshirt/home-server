# MANUAL PREREQUISITE - not done by this commit, requires a human with 1Password access:
#   1. Generate a random key: `openssl rand -hex 32`.
#   2. Add it to 1Password under vaults/homelab/items/n8n-encryption-key, with a field
#      labeled exactly `N8N_ENCRYPTION_KEY` - the chart's `existingEncryptionKeySecret`
#      (values.yaml) imports every key of the synced Secret verbatim via envFrom, so the
#      field label must match exactly. Losing/rotating this key makes every credential
#      n8n has encrypted at rest unreadable - back it up outside 1Password's own homelab
#      vault too.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: n8n-encryption-key
  namespace: n8n
spec:
  itemPath: "vaults/homelab/items/n8n-encryption-key"
