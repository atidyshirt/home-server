podAnnotations:
  addons_domain: placeholder-domain

config:
  issuer: https://dex.PLACEHOLDER_DOMAIN
  storage:
    type: kubernetes
    config:
      inCluster: true
  web:
    http: 0.0.0.0:5556
  oauth2:
    skipApprovalScreen: true
  staticClients:
    - id: argocd
      name: ArgoCD
      secret: PLACEHOLDER_ARGOCD_CLIENT_SECRET
      redirectURIs:
        - https://argo.PLACEHOLDER_DOMAIN/auth/callback
  connectors:
    - type: oidc
      id: auth0
      name: Auth0
      config:
        issuer: https://PLACEHOLDER_AUTH0_DOMAIN/
        clientID: PLACEHOLDER_AUTH0_CLIENT_ID
        clientSecret: PLACEHOLDER_AUTH0_CLIENT_SECRET
        redirectURI: https://dex.PLACEHOLDER_DOMAIN/callback
        insecureSkipEmailVerified: true
        scopes:
          - openid
          - profile
          - email
        claimMapping:
          groups: https://homelab.arpa/roles

httpRoute:
  enabled: true
  parentRefs:
    - name: lan-gateway
      namespace: traefik
  hostnames:
    - dex.placeholder-domain
