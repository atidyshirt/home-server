podAnnotations:
  addons_domain: placeholder-domain

envVars:
  - name: DOMAIN
    valueFrom:
      fieldRef:
        fieldPath: metadata.annotations['addons_domain']
  - name: AUTH0_DOMAIN
    valueFrom:
      secretKeyRef:
        name: oidc-auth0
        key: tenant
  - name: AUTH0_CLIENT_ID
    valueFrom:
      secretKeyRef:
        name: oidc-auth0
        key: client-id
  - name: AUTH0_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: oidc-auth0
        key: client-secret
  - name: ARGOCD_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: oidc-dex
        key: password

config:
  issuer: https://dex.$DOMAIN
  storage:
    type: kubernetes
    config:
      inCluster: true
  web:
    http: 0.0.0.0:5556
  oauth2:
    skipApprovalScreen: true
  staticClients:
    - id: argocd
      name: ArgoCD
      secret: $ARGOCD_CLIENT_SECRET
      redirectURIs:
        - https://argo.$DOMAIN/auth/callback
  connectors:
    - type: oidc
      id: auth0
      name: Auth0
      config:
        issuer: https://$AUTH0_DOMAIN/
        clientID: $AUTH0_CLIENT_ID
        clientSecret: $AUTH0_CLIENT_SECRET
        redirectURI: https://dex.$DOMAIN/callback
        insecureSkipEmailVerified: true
        scopes:
          - openid
          - profile
          - email
        claimMapping:
          groups: https://homelab.arpa/roles

httpRoute:
  enabled: true
  parentRefs:
    - name: lan-gateway
      namespace: traefik
  hostnames:
    - dex.placeholder-domain
