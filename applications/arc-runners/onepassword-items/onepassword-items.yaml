# The 1Password item must have a field labeled exactly `github_token`, so the
# synced Secret key matches what the gha-runner-scale-set chart expects.
# Since atidyshirt is a personal account (not an org), runner registration is
# repo-scoped: the PAT needs fine-grained repo permission "Administration:
# Read and write" on atidyshirt/home-server (not the org-level "Self-hosted
# runners" permission, which only applies to GitHub Organizations).
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: arc-github-token
  namespace: arc-runners
spec:
  itemPath: "vaults/homelab/items/arc-github-token"
