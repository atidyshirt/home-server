# githubConfigSecret must reference a pre-existing Secret named "arc-github-token"
# in this namespace (see onepassword-items.yaml) with a `github_token` key.
#
# githubConfigUrl is repo-scoped, not account/org-scoped: atidyshirt is a
# personal GitHub account, and GitHub's self-hosted-runner registration API
# only supports org-wide or repo-level registration (no account-wide option).
# A repo-level runner can only run jobs from that one repo. Each future
# project therefore needs its own AutoscalingRunnerSet pointed at its own
# repo (see docs/projects.md) rather than sharing this one — this
# arc-runners instance is scoped to home-server itself.
githubConfigUrl: https://github.com/atidyshirt/home-server
runnerScaleSetName: home-server-runner-set
githubConfigSecret: arc-github-token

# The chart normally auto-discovers the controller's ServiceAccount via a
# cluster-side label lookup at template time. ArgoCD's repo-server can't do
# that lookup, so it must be set explicitly to match the arc-controller
# release name/namespace (applications/arc-controller/base).
controllerServiceAccount:
  namespace: arc-systems
  name: arc-controller-gha-rs-controller
