# Defaults only, for `helm lint`/local testing - every real consumer
# (see addons/addon-arc-runners-appset.yaml) overrides these via
# `helm.valuesObject` per source. Subchart values must nest under the
# dependency's own name (see Chart.yaml).
gha-runner-scale-set:
  githubConfigUrl: https://github.com/PLACEHOLDER_ORG/placeholder-repo
  runnerScaleSetName: placeholder-runner-set
  githubConfigSecret: arc-github-token

  # Same controller for every runner set, cluster-wide - ArgoCD's
  # repo-server can't auto-discover this the way the chart normally
  # would at install-time, so it's always set explicitly.
  controllerServiceAccount:
    namespace: arc-systems
    name: arc-controller-gha-rs-controller

  # Runner pods otherwise have no way to trust *.homelab.arpa's self-signed
  # cert (confirmed live: curl exit 60, "unable to get local issuer
  # certificate" calling the build-trigger webhook from golfapp's notify
  # step). This is the chart's own first-class mechanism for a custom CA:
  # mounts the cert at runnerMountPath and sets RUNNER_UPDATE_CA_CERTS=1,
  # which makes the runner reload the OS trust store on start - curl (and
  # everything else) then trusts it system-wide, no per-call flag needed.
  # The ConfigMap itself is synced from cert-manager's homelab-ca-secret by
  # ../ca-sync's PreSync hook (Secrets/ConfigMaps are namespace-scoped, so
  # it has to be copied into this namespace).
  githubServerTLS:
    certificateFrom:
      configMapKeyRef:
        name: homelab-ca
        key: ca.crt
    runnerMountPath: /usr/local/share/ca-certificates/

  # Self-contained ephemeral pods, no shared/local-path volume across a workflow run -
  # safe to float onto the transient laptop node (see docs/adr/add-transient-laptop-worker-node.md).
  template:
    spec:
      tolerations:
        - key: node-role.homelab/tier
          operator: Equal
          value: transient
          effect: NoSchedule
      # Pods on the transient node can't reach CoreDNS's ClusterIP (no
      # kube-router service-proxy rule there - a separate, still-open
      # issue). The scale-set listener (on home-server) can still poll
      # GitHub fine and shows these runners as "Running", but the runner
      # itself can't resolve api.github.com/pipelines.actions.
      # githubusercontent.com to actually pick up an assigned job -
      # confirmed live, jobs stayed queued on GitHub's side indefinitely
      # against an idle "Running" runner. dnsPolicy: Default (the node's
      # own working resolver) fixes this the same way it did for
      # build-and-deploy (applications/argo-workflows/base/
      # workflowtemplates/build-and-deploy.yaml).
      dnsPolicy: Default
