# The 1Password item must have a field labeled exactly `github_token`
# (a fine-grained PAT with org-level "Self-hosted runners: Read and write"),
# so the synced Secret key matches what the gha-runner-scale-set chart expects.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: arc-github-token
  namespace: arc-runners
spec:
  itemPath: "vaults/homelab/items/arc-github-token"
