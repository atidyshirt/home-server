apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homelab-dev-tls
  namespace: traefik
  annotations:
    addons_domain: placeholder-domain
spec:
  secretName: homelab-dev-tls
  dnsNames:
    - placeholder-domain
    - '*.placeholder-domain'
  issuerRef:
    name: homelab-ca-issuer
    kind: ClusterIssuer
