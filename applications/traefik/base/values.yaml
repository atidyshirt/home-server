deployment:
  kind: DaemonSet
  dnsPolicy: ClusterFirstWithHostNet

updateStrategy:
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0

hostNetwork: true

service:
  spec:
    type: ClusterIP

ports:
  traefik:
    port: 9000
  web:
    port: 80
  websecure:
    port: 443

securityContext:
  capabilities:
    drop: []

podSecurityContext:
  runAsNonRoot: false
  runAsUser: 0
  runAsGroup: 0

providers:
  kubernetesGateway:
    enabled: true

gateway:
  name: lan-gateway
  listeners:
    web:
      port: 80
      namespacePolicy:
        from: All
    websecure:
      port: 443
      protocol: HTTPS
      mode: Terminate
      certificateRefs:
        - group: ''
          kind: Secret
          name: homelab-dev-tls
      namespacePolicy:
        from: All

gatewayClass:
  name: traefik
