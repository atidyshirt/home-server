deployment:
  kind: DaemonSet
  dnsPolicy: ClusterFirstWithHostNet

updateStrategy:
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0

hostNetwork: true

ports:
  traefik:
    port: 9000
  web:
    port: 80

securityContext:
  capabilities:
    drop: []

podSecurityContext:
  runAsNonRoot: false
  runAsUser: 0
  runAsGroup: 0

providers:
  kubernetesGateway:
    enabled: true

gateway:
  name: lan-gateway
  listeners:
    web:
      port: 80
      namespacePolicy:
        from: All

gatewayClass:
  name: traefik
