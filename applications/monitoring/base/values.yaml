crds:
  enabled: true

# home-server (the Pi) runs the whole control plane (etcd/API server/scheduler)
# plus nearly every workload - confirmed live via etcd timeouts cascading into
# probe failures cluster-wide under load. `ubuntu` (an orbstack VM, tainted
# node-role.homelab/tier=transient since it's a laptop that can disappear) has
# far more headroom (8 CPU/4Gi vs the Pi's 4 CPU/8Gi) and is otherwise sitting
# nearly idle. This stack is the heaviest tenant on the Pi, so every component
# below tolerates that taint and prefers scheduling there. Prometheus/Grafana's
# PVCs are local-path (node-pinned) - the preference is a no-op for already-
# bound volumes until they're recreated on ubuntu.
x-transientToleration: &transientToleration
  - key: node-role.homelab/tier
    operator: Equal
    value: transient
    effect: NoSchedule
x-transientAffinity: &transientAffinity
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: node-role.homelab/tier
              operator: In
              values: ["transient"]

prometheusOperator:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  # Kept on home-server deliberately (no toleration/affinity toward the
  # transient node): this constantly watches/lists CRDs via the API server,
  # which - like CoreDNS - only lives on home-server, so every one of those
  # calls from ubuntu crosses the same DERP-relayed Tailscale link (that
  # node has no direct peer connection, confirmed via `tailscale ping`).
  # Confirmed live: crash-looped repeatedly on ubuntu, healthy immediately
  # back on home-server. Its footprint is tiny, so there's no relief lost.

prometheus:
  prometheusSpec:
    retention: 2d
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 4Gi
    tolerations: *transientToleration
    affinity: *transientAffinity

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 50m
        memory: 64Mi
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi
    tolerations: *transientToleration
    affinity: *transientAffinity

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
  # Kept on home-server - same reasoning as prometheusOperator above: this
  # continuously lists/watches nearly every object in the cluster via the
  # API server, which only lives on home-server. Confirmed live: unhealthy/
  # restarting repeatedly on ubuntu.

prometheus-node-exporter:
  # Traefik (hostNetwork: true) already binds the host's port 9100 for its own metrics
  # endpoint - node-exporter needs a different port since it also runs on hostNetwork.
  service:
    port: 9101
    targetPort: 9101
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 32Mi
  # DaemonSet - needs both nodes covered for full metrics, not preferentially
  # scheduled on one, so tolerate the taint without an affinity preference.
  tolerations: *transientToleration

# k0s doesn't expose these the standard upstream way - default ServiceMonitors for
# them just sit permanently down. kubelet (incl. cAdvisor per-pod/container CPU+memory)
# stays enabled - that's what actually shows kaniko build usage relative to everything else.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

grafana:
  enabled: true
  # Without this, the chart tries to reuse an existing admin-password Secret via Helm's
  # `lookup` function - which doesn't work through ArgoCD's repo-server (kustomize's
  # helmCharts generator runs `helm template` without live cluster access), so it falls
  # back to generating a brand new random password on every single sync. That changes
  # the Secret every time, which changes the pod template's checksum/secret annotation
  # every time, which never lets the Deployment stabilize (confirmed empirically - the
  # Application never left OutOfSync/Progressing). A fixed password breaks that loop.
  # This is a break-glass fallback only - Dex SSO (mapped to the homelab:admin group) is
  # the primary login path, same security model as ArgoCD itself.
  adminPassword: 2fikIr4ssiCnMgF5sMCWZUuDpdSlTncT
  # SQLite (the default DB) lives on a single ReadWriteOnce PVC - the chart's default
  # RollingUpdate strategy briefly runs two replicas during a rollout, and two pods
  # writing the same SQLite file at once corrupts migrations (SQLITE_BUSY, then a
  # failed migration leaves the schema inconsistent). Recreate avoids that since only
  # one pod ever has the volume mounted.
  deploymentStrategy:
    type: Recreate
  podAnnotations:
    addons_domain: placeholder-domain
    addons_node_ip: placeholder-node-ip
  # The cluster's own kube-system CoreDNS doesn't know about the homelab.arpa zone
  # (only the LAN-facing coredns-lan addon does, and it only serves the host's LAN
  # interface, not in-cluster pod traffic) - so Grafana's server-to-server OAuth
  # token exchange with Dex can't resolve dex.<domain> on its own. Same fix as
  # argocd-server's own hostAliases patch (applied directly by Pulumi there, since
  # that Deployment isn't GitOps-managed).
  hostAliases:
    - ip: placeholder-node-ip
      hostnames:
        - dex.placeholder-domain
  defaultDashboardsEnabled: true
  # The chart's own livenessProbe gets a generous timeout (30s, failureThreshold 10),
  # but readinessProbe is left at Kubernetes' aggressive default (1s timeout, 3
  # failures) - on this hardware, a brief response-time hiccup under load (confirmed
  # live: "Readiness probe failed: context deadline exceeded" on a container that
  # never actually restarted) is enough to flap Grafana out of the Service. Matching
  # the liveness probe's tolerance here avoids that.
  readinessProbe:
    httpGet:
      path: /api/health
      port: grafana
    timeoutSeconds: 30
    failureThreshold: 10
  # Original sizing (50m/128Mi request, 200m/256Mi limit) was too conservative - sized
  # off the cluster's overall starved state at the start of this rollout, before
  # knowing the other components (Prometheus/Alertmanager/node-exporter/kube-state-
  # metrics) are all lean. Confirmed live: grafana was pegged at 197m/200m CPU
  # (constant throttling, explains slow WS/live requests) and got OOMKilled at the
  # 256Mi limit (explains the "bad gateway" during its restart). Other components
  # have plenty of headroom to give Grafana real resources instead.
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 750m
      memory: 512Mi
  persistence:
    enabled: true
    type: pvc
    storageClassName: local-path
    size: 1Gi
  envValueFrom:
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: oidc-dex
        key: grafana
  tolerations: *transientToleration
  affinity: *transientAffinity
  grafana.ini:
    server:
      root_url: https://grafana.PLACEHOLDER_DOMAIN
    auth.generic_oauth:
      enabled: true
      name: Dex
      client_id: grafana
      scopes: openid profile email
      auth_url: https://dex.PLACEHOLDER_DOMAIN/auth
      token_url: https://dex.PLACEHOLDER_DOMAIN/token
      api_url: https://dex.PLACEHOLDER_DOMAIN/userinfo
      role_attribute_path: "contains(groups[*], 'homelab:admin') && 'Admin' || 'Viewer'"
      # Grafana's outbound HTTP client doesn't trust the self-signed homelab-ca (same
      # class of problem argocd-server needed a CA-trust-bundle initContainer for) -
      # confirmed live: "tls: failed to verify certificate: x509: certificate signed
      # by unknown authority" on the token exchange call to dex.<domain>. This
      # connection is pod-to-pod within the cluster network, not crossing anything
      # untrusted, so skipping verification here (rather than building/maintaining a
      # CA trust bundle) is an acceptable tradeoff.
      tls_skip_verify_insecure: true
