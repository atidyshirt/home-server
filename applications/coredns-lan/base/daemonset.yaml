apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: coredns-lan
  namespace: coredns-lan
spec:
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: coredns-lan
  template:
    metadata:
      labels:
        app: coredns-lan
      annotations:
        addons_domain: placeholder-domain
        addons_node_ip: placeholder-node-ip
    spec:
      hostNetwork: true
      dnsPolicy: Default
      initContainers:
        - name: render-config
          image: busybox:1.36
          env:
            - name: DOMAIN
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['addons_domain']
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['addons_node_ip']
          command:
            - sh
            - -c
            - |
              mkdir -p /etc/coredns/zones
              sed "s/PLACEHOLDER_DOMAIN/$DOMAIN/g" /template/corefile/Corefile.tmpl > /etc/coredns/Corefile
              sed -e "s/PLACEHOLDER_DOMAIN/$DOMAIN/g" -e "s/PLACEHOLDER_NODE_IP/$NODE_IP/g" /template/zone/zone.tmpl > /etc/coredns/zones/$DOMAIN.zone
          volumeMounts:
            - name: corefile-template
              mountPath: /template/corefile
            - name: zone-template
              mountPath: /template/zone
            - name: rendered
              mountPath: /etc/coredns
      containers:
        - name: coredns
          image: coredns/coredns:1.14.6
          args: ["-conf", "/etc/coredns/Corefile"]
          ports:
            - containerPort: 53
              protocol: UDP
            - containerPort: 53
              protocol: TCP
          volumeMounts:
            - name: rendered
              mountPath: /etc/coredns
      volumes:
        - name: corefile-template
          configMap:
            name: coredns-lan-corefile
        - name: zone-template
          configMap:
            name: coredns-lan-zones
        - name: rendered
          emptyDir: {}
