# kubelet needs a kubernetes.io/dockerconfigjson secret to pull private
# GHCR images (e.g. ghcr.io/atidyshirt/gitops-deploy, used by
# bump-deploy-repo) - the Opaque ghcr-push secret from onepassword-items.yaml
# only carries the raw token, not that format. This Job derives ghcr-pull
# from it; the Argo Helm chart's workflow.serviceAccount.pullSecrets value
# (see kustomization.yaml) attaches it to the argo-workflow ServiceAccount.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ghcr-pull-secret-writer
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-weight: '-1'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ghcr-pull-secret-writer
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-weight: '-1'
rules:
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ghcr-pull-secret-writer
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-weight: '-1'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ghcr-pull-secret-writer
subjects:
  - kind: ServiceAccount
    name: ghcr-pull-secret-writer
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ghcr-pull-secret
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: ghcr-pull-secret-writer
      restartPolicy: Never
      containers:
        - name: create-pull-secret
          image: alpine:3.20
          command: [sh, -c]
          args:
            - |
              set -eu
              apk add --no-cache curl >/dev/null
              curl -sL "https://dl.k8s.io/release/v1.35.8/bin/linux/arm64/kubectl" -o /usr/local/bin/kubectl
              chmod +x /usr/local/bin/kubectl

              kubectl create secret docker-registry ghcr-pull \
                --docker-server=ghcr.io \
                --docker-username=atidyshirt \
                --docker-password="${GHCR_TOKEN}" \
                --dry-run=client -o yaml | kubectl apply -f -
          env:
            - name: GHCR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ghcr-push
                  key: github_token
