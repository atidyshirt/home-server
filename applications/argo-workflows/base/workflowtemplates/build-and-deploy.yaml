apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: build-and-deploy
  namespace: argo-workflows
spec:
  entrypoint: build-and-deploy
  serviceAccountName: argo-workflow
  synchronization:
    mutexes:
      - name: build-and-deploy
  # Self-contained ephemeral pods, no shared/local-path volume across a workflow run -
  # safe to float onto the transient laptop node (see docs/adr/add-transient-laptop-worker-node.md).
  # Applies to every step's pod (Argo Workflows propagates spec-level tolerations down).
  tolerations:
    - key: node-role.homelab/tier
      operator: Equal
      value: transient
      effect: NoSchedule
  # Steps here only ever resolve external hostnames (github.com, ghcr.io), never
  # in-cluster service names, so they don't need CoreDNS at all. The transient
  # node's pods currently can't reach CoreDNS's ClusterIP (no kube-router
  # service-proxy rule there - a separate, still-open issue), which broke
  # git clone/push with "Could not resolve host" (git exit 128). Using the
  # node's own working resolver instead sidesteps that entirely - confirmed
  # live via a test pod with this same policy successfully cloning over git.
  dnsPolicy: Default
  arguments:
    parameters:
      - name: repo
      - name: sha
      - name: deploy_repo
      - name: app
        value: ""
      - name: context
        value: "."
      - name: dockerfile
        value: Dockerfile
      - name: deploy_path
        value: deploy
      # Opt-in escape hatch: when set, prepare/build-and-push (kaniko) are
      # skipped entirely and bump-deploy-repo uses this ref directly. Lets a
      # project build+push on its own GitHub-hosted Actions runners instead
      # of this template's in-cluster kaniko step, while still going through
      # the same shared deploy step. See home-server's
      # build-golfapp-images-with-github-actions ADR - golfapp's monorepo
      # (3 images) was hitting ~15min kaniko builds on the Pi's hardware.
      # Every other project leaves this empty and is unaffected.
      - name: prebuilt_image
        value: ""
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        # workspace-nfs (see applications/nfs-provisioner) instead of the default local-path -
        # a shared workspace lets steps in the same run land on different nodes and lets a
        # step killed by the laptop disconnecting be retried onto the Pi instead of getting
        # stuck waiting for a PV that only the vanished node can mount.
        accessModes: ["ReadWriteMany"]
        storageClassName: workspace-nfs
        resources:
          requests:
            storage: 2Gi
  templates:
    - name: build-and-deploy
      steps:
        - - name: prepare
            template: prepare
            when: "'{{workflow.parameters.prebuilt_image}}' == ''"
        - - name: build-and-push
            template: build-and-push
            when: "'{{workflow.parameters.prebuilt_image}}' == ''"
            arguments:
              parameters:
                - name: image
                  value: '{{steps.prepare.outputs.parameters.image}}'
        - - name: bump-deploy-repo-built
            template: bump-deploy-repo
            when: "'{{workflow.parameters.prebuilt_image}}' == ''"
            arguments:
              parameters:
                - name: image
                  value: '{{steps.prepare.outputs.parameters.image}}'
          - name: bump-deploy-repo-prebuilt
            template: bump-deploy-repo
            when: "'{{workflow.parameters.prebuilt_image}}' != ''"
            arguments:
              parameters:
                - name: image
                  value: '{{workflow.parameters.prebuilt_image}}'

    - name: prepare
      outputs:
        parameters:
          - name: image
            valueFrom:
              path: /mnt/workspace/image
      container:
        image: alpine/git:2.43.0
        command: [sh, -c]
        args:
          - |
            set -eu
            REPO="{{workflow.parameters.repo}}"
            APP="{{workflow.parameters.app}}"
            ORG="${REPO%%/*}"
            REPO_NAME="${REPO#*/}"
            IMAGE_NAME="${APP:-$REPO_NAME}"
            printf '%s' "ghcr.io/${ORG}/${IMAGE_NAME}" > /mnt/workspace/image

            mkdir -p /mnt/workspace/src
            cd /mnt/workspace/src
            git init -q
            git remote add origin "https://x-access-token:${GIT_TOKEN}@github.com/${REPO}.git"
            git fetch --depth=1 origin "{{workflow.parameters.sha}}"
            git checkout -q FETCH_HEAD

            mkdir -p /mnt/workspace/docker-config
            AUTH=$(printf '%s' "atidyshirt:${GHCR_TOKEN}" | base64 | tr -d '\n')
            cat > /mnt/workspace/docker-config/config.json <<EOF
            {"auths":{"ghcr.io":{"auth":"${AUTH}"}}}
            EOF
        volumeMounts:
          - name: workspace
            mountPath: /mnt/workspace
        env:
          - name: GIT_TOKEN
            valueFrom:
              secretKeyRef:
                name: arc-github-token
                key: github_token
          - name: GHCR_TOKEN
            valueFrom:
              secretKeyRef:
                name: ghcr-push
                key: github_token

    - name: build-and-push
      inputs:
        parameters:
          - name: image
      # A step killed mid-run by the laptop worker disconnecting is retried, not resumed -
      # acceptable since kaniko's own --cache flag above makes a retried build cheap.
      retryStrategy:
        limit: 2
        retryPolicy: OnError
      container:
        image: gcr.io/kaniko-project/executor:latest
        args:
          - --context=dir:///mnt/workspace/src/{{workflow.parameters.context}}
          - --dockerfile=/mnt/workspace/src/{{workflow.parameters.dockerfile}}
          - --destination={{inputs.parameters.image}}:{{workflow.parameters.sha}}
          - --snapshot-mode=redo
          - --cache=true
          - --cache-repo={{inputs.parameters.image}}/cache
          - --cache-ttl=168h
        volumeMounts:
          - name: workspace
            mountPath: /mnt/workspace
          - name: workspace
            mountPath: /kaniko/.docker
            subPath: docker-config

    - name: bump-deploy-repo
      inputs:
        parameters:
          - name: image
      container:
        image: ghcr.io/atidyshirt/gitops-deploy:v5.6.0
        command: [sh, -c]
        args:
          - |
            set -eu
            git clone "https://x-access-token:${GITOPS_TOKEN}@github.com/{{workflow.parameters.deploy_repo}}.git" /mnt/workspace/deploy
            cd "/mnt/workspace/deploy/{{workflow.parameters.deploy_path}}"
            kustomize edit set image "{{inputs.parameters.image}}={{inputs.parameters.image}}:{{workflow.parameters.sha}}"
            kustomize build . >/dev/null

            git config user.name "gitops-bot"
            git config user.email "gitops-bot@users.noreply.github.com"
            git add kustomization.yaml
            git commit -m "Bump image to {{workflow.parameters.sha}}"
            git push
        volumeMounts:
          - name: workspace
            mountPath: /mnt/workspace
        env:
          - name: GITOPS_TOKEN
            valueFrom:
              secretKeyRef:
                name: gitops-bot
                key: github_token
