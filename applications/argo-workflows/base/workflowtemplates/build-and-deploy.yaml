apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: build-and-deploy
  namespace: argo-workflows
spec:
  entrypoint: build-and-deploy
  serviceAccountName: argo-workflow
  arguments:
    parameters:
      - name: repo
      - name: sha
      - name: deploy_repo
      - name: app
        value: ""
      - name: context
        value: "."
      - name: dockerfile
        value: Dockerfile
      - name: deploy_path
        value: deploy
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
  templates:
    - name: build-and-deploy
      steps:
        - - name: prepare
            template: prepare
        - - name: build-and-push
            template: build-and-push
            arguments:
              parameters:
                - name: image
                  value: '{{steps.prepare.outputs.parameters.image}}'
        - - name: bump-deploy-repo
            template: bump-deploy-repo
            arguments:
              parameters:
                - name: image
                  value: '{{steps.prepare.outputs.parameters.image}}'

    - name: prepare
      outputs:
        parameters:
          - name: image
            valueFrom:
              path: /mnt/workspace/image
      container:
        image: alpine/git:2.43.0
        command: [sh, -c]
        args:
          - |
            set -eu
            REPO="{{workflow.parameters.repo}}"
            APP="{{workflow.parameters.app}}"
            ORG="${REPO%%/*}"
            REPO_NAME="${REPO#*/}"
            IMAGE_NAME="${APP:-$REPO_NAME}"
            printf '%s' "ghcr.io/${ORG}/${IMAGE_NAME}" > /mnt/workspace/image

            git clone "https://x-access-token:${GIT_TOKEN}@github.com/${REPO}.git" /mnt/workspace/src
            cd /mnt/workspace/src
            git checkout "{{workflow.parameters.sha}}"

            mkdir -p /mnt/workspace/docker-config
            AUTH=$(printf '%s' "atidyshirt:${GHCR_TOKEN}" | base64 | tr -d '\n')
            cat > /mnt/workspace/docker-config/config.json <<EOF
            {"auths":{"ghcr.io":{"auth":"${AUTH}"}}}
            EOF
        volumeMounts:
          - name: workspace
            mountPath: /mnt/workspace
        env:
          - name: GIT_TOKEN
            valueFrom:
              secretKeyRef:
                name: arc-github-token
                key: github_token
          - name: GHCR_TOKEN
            valueFrom:
              secretKeyRef:
                name: ghcr-push
                key: github_token

    - name: build-and-push
      inputs:
        parameters:
          - name: image
      container:
        image: gcr.io/kaniko-project/executor:latest
        args:
          - --context=dir:///mnt/workspace/src/{{workflow.parameters.context}}
          - --dockerfile=/mnt/workspace/src/{{workflow.parameters.dockerfile}}
          - --destination={{inputs.parameters.image}}:{{workflow.parameters.sha}}
          - --snapshot-mode=redo
        volumeMounts:
          - name: workspace
            mountPath: /mnt/workspace
          - name: workspace
            mountPath: /kaniko/.docker
            subPath: docker-config

    - name: bump-deploy-repo
      inputs:
        parameters:
          - name: image
      container:
        image: alpine:3.20
        command: [sh, -c]
        args:
          - |
            set -eu
            apk add --no-cache git curl bash >/dev/null
            curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" \
              | bash -s -- 5.6.0 /usr/local/bin >/dev/null

            git clone "https://x-access-token:${GITOPS_TOKEN}@github.com/{{workflow.parameters.deploy_repo}}.git" /mnt/workspace/deploy
            cd "/mnt/workspace/deploy/{{workflow.parameters.deploy_path}}"
            kustomize edit set image "{{inputs.parameters.image}}={{inputs.parameters.image}}:{{workflow.parameters.sha}}"
            kustomize build . >/dev/null

            git config user.name "gitops-bot"
            git config user.email "gitops-bot@users.noreply.github.com"
            git add kustomization.yaml
            git commit -m "Bump image to {{workflow.parameters.sha}}"
            git push
        volumeMounts:
          - name: workspace
            mountPath: /mnt/workspace
        env:
          - name: GITOPS_TOKEN
            valueFrom:
              secretKeyRef:
                name: gitops-bot
                key: github_token
