apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argo-workflows
  annotations:
    addons_domain: placeholder-domain
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: lan-gateway
      namespace: traefik
  hostnames:
    - argo-workflows.placeholder-domain
  rules:
    # matches/weight declared explicitly, not left to defaulting - the
    # Gateway API implementation fills these in server-side when
    # omitted (matches defaults to PathPrefix "/", weight defaults to 1),
    # which ArgoCD then sees as permanent drift against the git manifest.
    # Same fix as applications/dex/base's own HTTPRoute chart template.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ''
          kind: Service
          name: argo-workflows-server
          port: 2746
          weight: 1
