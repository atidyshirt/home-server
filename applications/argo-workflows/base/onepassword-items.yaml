# Both items use a field labeled `github_token`, matching the pattern in
# applications/arc-runners/onepassword-items - the synced Secret's data
# key follows the same name.
#
# ghcr-push: classic PAT, `write:packages` scope - used by kaniko to push
# built images to GHCR (ATI-44). Classic (not fine-grained) since GHCR
# package-publish permission for a not-yet-existing image can't be
# granted on a fine-grained token scoped to a specific repo ahead of time.
#
# gitops-bot: fine-grained PAT, "Contents: Read and write" on
# atidyshirt/golfapp-platform - used to commit image-tag bumps back into
# a project's deploy/ path (ATI-45). Fine-grained PATs are per-repo, so
# onboarding a new project's deploy repo means adding it to this token's
# repository access, not creating a new token.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: ghcr-push
  namespace: argo-workflows
spec:
  itemPath: "vaults/homelab/items/ghcr-push"
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: gitops-bot
  namespace: argo-workflows
spec:
  itemPath: "vaults/homelab/items/gitops-bot"
---
# Same 1Password item as applications/arc-runners/onepassword-items -
# synced into a second namespace so the build-and-deploy WorkflowTemplate
# can clone private *source* repos (Secrets are namespace-scoped, so a
# Workflow pod in argo-workflows can't reference the copy living in
# arc-runners). It's a classic, broad `repo`-scope PAT (confirmed - see
# arc-runners/onepassword-items), so it's valid read access for any
# atidyshirt repo, not just home-server. ghcr-push/gitops-bot are
# deliberately narrower (write:packages only; contents:write scoped to
# just the deploy repo) since those are actual write credentials.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: arc-github-token
  namespace: argo-workflows
spec:
  itemPath: "vaults/homelab/items/arc-github-token"
