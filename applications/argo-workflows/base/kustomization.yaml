apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: argo-workflows
    repo: https://argoproj.github.io/argo-helm
    version: 2.0.1
    releaseName: argo-workflows
    namespace: argo-workflows
    valuesInline:
      server:
        extraArgs:
          - --auth-mode=server

resources:
  - sensor-rbac.yaml
  - onepassword-items.yaml
