apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: argo-workflows
    repo: https://argoproj.github.io/argo-helm
    version: 2.0.1
    releaseName: argo-workflows
    namespace: argo-workflows
    valuesInline:
      server:
        extraArgs:
          - --auth-mode=server

resources:
  - sensor-rbac.yaml
  - onepassword-items.yaml
  - workflowtemplates/build-and-deploy.yaml
  - httproute.yaml

# See applications/traefik/base's Certificate self-reference for the full
# explanation of this gitops-bridge domain-templating pattern.
replacements:
  - source:
      kind: HTTPRoute
      name: argo-workflows
      fieldPath: metadata.annotations.addons_domain
    targets:
      - select:
          kind: HTTPRoute
          name: argo-workflows
        fieldPaths:
          - spec.hostnames.0
        options:
          delimiter: '.'
          index: 1
