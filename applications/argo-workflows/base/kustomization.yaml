apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: argo-workflows
    repo: https://argoproj.github.io/argo-helm
    version: 2.0.1
    releaseName: argo-workflows
    namespace: argo-workflows
    valuesInline:
      controller:
        metricsConfig:
          enabled: true
      server:
        extraArgs:
          - --auth-mode=server
      workflow:
        serviceAccount:
          create: true
          pullSecrets:
            - name: ghcr-pull

resources:
  - sensor-rbac.yaml
  - onepassword-items.yaml
  - workflowtemplates/build-and-deploy.yaml
  - httproute.yaml
  - ghcr-pull-secret.yaml
  - servicemonitor.yaml
  # The argo-workflows chart's own CRDs (Workflow/WorkflowTemplate/CronWorkflow/etc.) don't
  # come through `kustomize build --enable-helm` at all - confirmed via local render, zero
  # CustomResourceDefinition objects in the output despite the chart bundling them (same class
  # of gap as onepassword-operator's OnePasswordItem CRD, ATI - both charts ship CRDs in a
  # `crds/` dir kustomize's helm inflator doesn't pick up). Vendored here as a direct upstream
  # kustomize resource, pinned to the exact release the chart version (2.0.1) maps to
  # (appVersion v4.1.1, confirmed via that chart's own Chart.yaml) rather than checked into
  # this repo, so bumping the chart version is the only place version drift can creep in.
  - https://github.com/argoproj/argo-workflows/manifests/base/crds/full?ref=v4.1.1

patches:
  # Some of these CRDs (Workflow, WorkflowTemplate, CronWorkflow, ClusterWorkflowTemplate)
  # have large enough OpenAPI schemas to blow past the 256KB last-applied-configuration
  # annotation limit under client-side apply - confirmed empirically. ServerSideApply=true
  # (every addon-*-appset.yaml's syncPolicy) sidesteps that automatically, but ArgoCD still
  # validates the whole sync batch up front, and a WorkflowTemplate CR failing to validate
  # because its CRD doesn't exist *yet* fails the entire sync, not just that one resource.
  # sync-wave -1 (same pattern as cert-manager's bootstrap-issuer -> CA -> issuer chain)
  # forces these to land, and their apiextensions.k8s.io/v1 status to settle, in their own
  # earlier phase before anything else in this Application - including the WorkflowTemplate
  # CR two waves later - is even considered.
  - target:
      kind: CustomResourceDefinition
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: placeholder
        annotations:
          argocd.argoproj.io/sync-wave: "-1"

replacements:
  - source:
      kind: HTTPRoute
      name: argo-workflows
      fieldPath: metadata.annotations.addons_domain
    targets:
      - select:
          kind: HTTPRoute
          name: argo-workflows
        fieldPaths:
          - spec.hostnames.0
        options:
          delimiter: '.'
          index: 1
