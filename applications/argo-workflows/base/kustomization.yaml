apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: argo-workflows
    repo: https://argoproj.github.io/argo-helm
    version: 2.0.1
    releaseName: argo-workflows
    namespace: argo-workflows
    valuesInline:
      controller:
        metricsConfig:
          enabled: true
      server:
        extraArgs:
          - --auth-mode=server
      workflow:
        serviceAccount:
          create: true
          pullSecrets:
            - name: ghcr-pull

resources:
  - sensor-rbac.yaml
  - onepassword-items.yaml
  - workflowtemplates/build-and-deploy.yaml
  - httproute.yaml
  - ghcr-pull-secret.yaml
  # The chart's own ServiceMonitor template is gated behind
  # `.Capabilities.APIVersions.Has "monitoring.coreos.com/v1"`, which requires live
  # cluster API access ArgoCD's repo-server doesn't have during `kustomize build`
  # (same class of limitation as the Grafana admin-password `lookup` issue) - so it
  # never renders regardless of the values toggle. Hand-written here instead,
  # targeting the metrics port the chart's own Service already exposes.
  - servicemonitor.yaml

replacements:
  - source:
      kind: HTTPRoute
      name: argo-workflows
      fieldPath: metadata.annotations.addons_domain
    targets:
      - select:
          kind: HTTPRoute
          name: argo-workflows
        fieldPaths:
          - spec.hostnames.0
        options:
          delimiter: '.'
          index: 1
