apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: argo-workflows
    repo: https://argoproj.github.io/argo-helm
    version: 2.0.1
    releaseName: argo-workflows
    namespace: argo-workflows
    valuesInline:
      server:
        extraArgs:
          - --auth-mode=server
      # The chart provisions RBAC (Role+RoleBinding granting
      # workflowtaskresults create/patch, needed to report step outputs
      # like build-and-deploy's `image` parameter) for a ServiceAccount
      # named "argo-workflow" - but doesn't create it by default. Without
      # this, Workflow pods fall back to the namespace's `default` SA,
      # which lacks that RBAC entirely (confirmed live: "workflowtask
      # results.argoproj.io is forbidden"). build-and-deploy.yaml sets
      # `serviceAccountName: argo-workflow` to match.
      workflow:
        serviceAccount:
          create: true

resources:
  - sensor-rbac.yaml
  - onepassword-items.yaml
  - workflowtemplates/build-and-deploy.yaml
  - httproute.yaml

# See applications/traefik/base's Certificate self-reference for the full
# explanation of this gitops-bridge domain-templating pattern.
replacements:
  - source:
      kind: HTTPRoute
      name: argo-workflows
      fieldPath: metadata.annotations.addons_domain
    targets:
      - select:
          kind: HTTPRoute
          name: argo-workflows
        fieldPaths:
          - spec.hostnames.0
        options:
          delimiter: '.'
          index: 1
