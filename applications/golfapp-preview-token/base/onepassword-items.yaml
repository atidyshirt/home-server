# ArgoCD's pullRequest generator (addons/addon-golfapp-preview-appset.yaml) needs its tokenRef
# Secret in the argocd namespace itself - the ApplicationSet controller's own namespace, not a
# per-app namespace like arc-runners/dex use for their own OnePasswordItems (ATI-81). Always-on
# (gated on platform.stack.enabled, not golfapp-preview.stack.enabled) so the token exists
# ahead of the preview stack toggle ever being flipped on.
#
# MANUAL PREREQUISITE - not done by this commit, requires a human with 1Password access:
#   1. Create a fine-grained GitHub PAT scoped to atidyshirt/golf-ai-experiment with
#      "Pull requests: Read" only (no other permissions).
#   2. Add it to 1Password under vaults/homelab/items/golfapp-preview-github-token, with a
#      field labeled exactly `token` - the key addon-golfapp-preview-appset.yaml's pullRequest
#      generator reads from the synced Secret.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: golfapp-preview-github-token
  namespace: argocd
spec:
  itemPath: "vaults/homelab/items/golfapp-preview-github-token"
