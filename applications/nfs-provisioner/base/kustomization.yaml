apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: nfs-subdir-external-provisioner
    repo: https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner
    version: 4.0.18
    releaseName: nfs-subdir-external-provisioner
    namespace: nfs-provisioner
    valuesFile: values.yaml

patches:
  - target:
      kind: Deployment
      name: nfs-subdir-external-provisioner
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: nfs-subdir-external-provisioner
        annotations:
          addons_node_ip: placeholder-node-ip

replacements:
  - source:
      kind: Deployment
      name: nfs-subdir-external-provisioner
      fieldPath: metadata.annotations.addons_node_ip
    targets:
      - select:
          kind: Deployment
          name: nfs-subdir-external-provisioner
        fieldPaths:
          - spec.template.spec.containers.[name=nfs-subdir-external-provisioner].env.[name=NFS_SERVER].value
          # The chart also templates nfs.server directly into its own volume mount (what the
          # provisioner pod itself mounts to manage subdirectories) - a separate field from the
          # env var above, easy to miss since both come from the same values.yaml key. Volumes
          # can't use the Downward API (unlike env vars), so this has to be a real kustomize
          # replacement, not a runtime fieldRef - confirmed missing this caused the actual
          # mount failure ("Failed to resolve server placeholder-node-ip"), not the env var.
          - spec.template.spec.volumes.[name=nfs-subdir-external-provisioner-root].nfs.server
