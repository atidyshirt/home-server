apiVersion: v1
kind: ServiceAccount
metadata:
  name: ghcr-pull-secret-writer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ghcr-pull-secret-writer
rules:
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get, create, update, patch]
  # Needed to add imagePullSecrets to the namespace's own default
  # ServiceAccount (see default-serviceaccount.yaml).
  - apiGroups: ['']
    resources: [serviceaccounts]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ghcr-pull-secret-writer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ghcr-pull-secret-writer
subjects:
  - kind: ServiceAccount
    name: ghcr-pull-secret-writer
