# Classic PAT, `write:packages` scope - used by kaniko to push built images
# to GHCR (ATI-44), and by golfapp's own trigger-*.yml GitHub Actions
# workflows via their prebuilt_image path. Classic (not fine-grained) since
# GHCR package-publish permission for a not-yet-existing image can't be
# granted on a fine-grained token scoped to a specific repo ahead of time.
#
# Must be a PreSync hook (not a plain resource): the ghcr-pull-secret Job in
# this same Application also runs PreSync and reads the Secret this item
# produces, and PreSync hooks run before any ordinary Sync-phase resource is
# even applied - so this item has to be a hook itself, at the same weight as
# the Job's RBAC (ATI-90). itemPath doesn't vary across consuming namespaces,
# only the destination namespace (set by the consuming Application).
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: ghcr-push
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-weight: '-1'
spec:
  itemPath: "vaults/homelab/items/ghcr-push"
