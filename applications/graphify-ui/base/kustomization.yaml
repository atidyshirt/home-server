apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - httproute.yaml

# index.html is a checked-in copy of graphify-out/graph.html, not a build-time reference to it -
# this repo's kustomize bases stay self-contained (no cross-directory file refs; the local
# kubeconform pre-commit hook runs `kustomize build` with default load restrictions and rejects
# them). Re-copy after regenerating the graph: cp graphify-out/graph.html applications/graphify-ui/base/index.html
configMapGenerator:
  - name: graphify-ui
    files:
      - index.html

replacements:
  - source:
      kind: HTTPRoute
      name: graphify-ui
      fieldPath: metadata.annotations.addons_domain
    targets:
      - select:
          kind: HTTPRoute
          name: graphify-ui
        fieldPaths:
          - spec.hostnames.0
        options:
          delimiter: '.'
          index: 1
