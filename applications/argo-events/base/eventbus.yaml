apiVersion: argoproj.io/v1alpha1
kind: EventBus
metadata:
  name: default
  namespace: argo-events
spec:
  jetstream:
    version: latest
    replicas: 1
    # The controller's default stream replica count is 3 (for HA), but NATS
    # rejects stream replicas > 1 when running non-clustered (a single
    # JetStream server pod, as above) -- causes every EventSource/Sensor to
    # crash-loop on "replicas > 1 not supported in non-clustered mode".
    #
    # streamConfig is a raw YAML *string* (block scalar), not a nested
    # mapping -- the first attempt at this fix used a nested `replicas: 1`
    # object here, which the CRD's schema-less spec silently accepted but
    # the controller never actually parsed, so it kept using its built-in
    # default template (replicas: 3) regardless.
    streamConfig: |
      replicas: 1
