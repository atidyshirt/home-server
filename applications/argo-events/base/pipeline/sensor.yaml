apiVersion: v1
kind: ServiceAccount
metadata:
  name: build-trigger-sensor
  namespace: argo-events
---
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: build-trigger
  namespace: argo-events
spec:
  eventBusName: default
  template:
    serviceAccountName: build-trigger-sensor
  dependencies:
    - name: push-dep
      eventSourceName: build-trigger
      eventName: push
  triggers:
    - template:
        name: submit-build-and-deploy-workflow
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: build-and-deploy-
                namespace: argo-workflows
              spec:
                workflowTemplateRef:
                  name: build-and-deploy
                arguments:
                  parameters:
                    - name: repo
                      value: placeholder
                    - name: sha
                      value: placeholder
                    - name: deploy_repo
                      value: placeholder
          parameters:
            - src:
                dependencyName: push-dep
                dataKey: body.repo
              dest: spec.arguments.parameters.0.value
            - src:
                dependencyName: push-dep
                dataKey: body.sha
              dest: spec.arguments.parameters.1.value
            - src:
                dependencyName: push-dep
                dataKey: body.deploy_repo
              dest: spec.arguments.parameters.2.value
