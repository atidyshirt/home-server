apiVersion: v1
kind: ServiceAccount
metadata:
  name: build-trigger-sensor
  namespace: argo-events
---
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: build-trigger
  namespace: argo-events
spec:
  eventBusName: default
  template:
    serviceAccountName: build-trigger-sensor
  dependencies:
    - name: push-dep
      eventSourceName: build-trigger
      eventName: push
  triggers:
    - template:
        name: submit-build-and-deploy-workflow
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: build-and-deploy-
                namespace: argo-workflows
              spec:
                workflowTemplateRef:
                  name: build-and-deploy
                arguments:
                  parameters:
                    - name: repo
                      value: placeholder
                    - name: sha
                      value: placeholder
                    - name: deploy_repo
                      value: placeholder
                    # app/context/dockerfile/deploy_path exist for monorepos
                    # with more than one buildable image (e.g. golfapp's
                    # api/web/dotgolf-service, which all need the repo root
                    # as kaniko's build context - shared Nx libs - but a
                    # per-app Dockerfile path). A plain single-Dockerfile-
                    # at-root project can omit them from its trigger payload
                    # and fall back to these defaults via each parameter's
                    # `src.value` below. Not yet consumed by a
                    # WorkflowTemplate (ATI-48/49) - passthrough only today.
                    - name: app
                      value: ""
                    - name: context
                      value: "."
                    - name: dockerfile
                      value: Dockerfile
                    - name: deploy_path
                      value: deploy
                    # Set by projects that build+push on their own
                    # GitHub-hosted Actions runners instead of this
                    # pipeline's kaniko step (see build-and-deploy.yaml's
                    # prebuilt_image parameter). Absent/empty for every
                    # other project.
                    - name: prebuilt_image
                      value: ""
          parameters:
            - src:
                dependencyName: push-dep
                dataKey: body.repo
              dest: spec.arguments.parameters.0.value
            - src:
                dependencyName: push-dep
                dataKey: body.sha
              dest: spec.arguments.parameters.1.value
            - src:
                dependencyName: push-dep
                dataKey: body.deploy_repo
              dest: spec.arguments.parameters.2.value
            - src:
                dependencyName: push-dep
                dataKey: body.app
                value: ""
              dest: spec.arguments.parameters.3.value
            - src:
                dependencyName: push-dep
                dataKey: body.context
                value: "."
              dest: spec.arguments.parameters.4.value
            - src:
                dependencyName: push-dep
                dataKey: body.dockerfile
                value: Dockerfile
              dest: spec.arguments.parameters.5.value
            - src:
                dependencyName: push-dep
                dataKey: body.deploy_path
                value: deploy
              dest: spec.arguments.parameters.6.value
            - src:
                dependencyName: push-dep
                dataKey: body.image
                value: ""
              dest: spec.arguments.parameters.7.value
