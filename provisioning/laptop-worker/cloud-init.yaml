#cloud-config
# Cloud-init equivalent of the old lima.yaml provision script - installs tailscale + k0s on
# first boot. Resource limits (2 CPU / 4GiB / 20GiB) live in join.sh's `orbctl create` flags
# instead of here, since OrbStack machines take those as CLI flags, not user-data fields.
# No host filesystem sharing configured - this machine only ever runs floating ARC runner /
# Argo Workflows build pods, nothing needs to read the Mac's own files (OrbStack's default
# file-sharing integration is simply unused, not explicitly disabled - there's no
# `mounts: []`-equivalent user-data field).
runcmd:
  - [ sh, -c, "command -v tailscale >/dev/null 2>&1 || curl -fsSL https://tailscale.com/install.sh | sh" ]
  - [ sh, -c, "command -v k0s >/dev/null 2>&1 || curl -sSLf https://get.k0s.sh | sh" ]
