# Git directory generator: each deploy/* folder in golfapp-platform
# (github.com/atidyshirt/golfapp-platform, the deploy-side repo for
# golfapp - see homelab-deploy-template) becomes its own ArgoCD
# Application, so golfapp's 3 independently-built apps (api, web,
# dotgolf-service) are each deployed/synced independently. Literal
# repoURL (not the templated addons_repo_url annotation used by
# addons/*-appset.yaml) - this points at golfapp-platform, a different
# repo from home-server itself.
#
# matrix, not a bare git generator: {{metadata.annotations.addons_domain}}
# only resolves when a `clusters` generator is part of the mix (it reads
# the in-cluster Secret's annotations - see gitopsBridge.ts) - confirmed
# live that a bare git generator passes that template string through
# unresolved (`kubectl get application golfapp-api -o jsonpath=
# '{.spec.source.kustomize.commonAnnotations}'` showed the literal
# '{{metadata.annotations.addons_domain}}' string, not a real domain).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: golfapp
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/atidyshirt/golfapp-platform
              revision: main
              directories:
                - path: deploy/*
          - clusters: {}
  template:
    metadata:
      name: 'golfapp-{{path.basename}}'
    spec:
      project: golf-application
      source:
        repoURL: https://github.com/atidyshirt/golfapp-platform
        targetRevision: main
        path: '{{path}}'
        kustomize:
          commonAnnotations:
            addons_domain: '{{metadata.annotations.addons_domain}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: golf
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
---
# golfapp's own per-repo AutoscalingRunnerSet - repo-scoped runner
# registration only (atidyshirt is a personal account, no org-wide
# option - see homelab-app-template's README), so home-server's own
# home-server-runner-set can't serve golfapp's Actions jobs; GitHub only
# ever dispatches a repo's jobs to a runner scale set registered against
# that same repo, regardless of the underlying PAT's scope.
#
# Multi-source Application, not a kustomize helmCharts base like
# applications/arc-runners/base: source #1 is the upstream chart itself
# (unmodified, shared with every future project); source #2 is a `ref`
# to this repo so source #1 can pull a *real* per-project values file
# via `$values/...` - deliberately not the gitops-bridge placeholder+
# commonAnnotations+replacements idiom used elsewhere, because that
# pattern only patches metadata/spec *after* the chart renders, and this
# chart derives several resource names (ServiceAccount, Role,
# RoleBinding) from runnerScaleSetName *during* rendering - a shared
# placeholder value would make every project's aux RBAC resources
# collide by name in the shared arc-runners namespace. Feeding the real
# value in before rendering sidesteps that entirely: `project: platform`
# (not golf-application) since this is platform/CI plumbing, not part of
# golfapp's own deploy surface - see platform's sourceRepos for why the
# chart repo is whitelisted there instead.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: golfapp-arc-runner-set
  namespace: argocd
spec:
  project: platform
  sources:
    - repoURL: oci://ghcr.io/actions/actions-runner-controller-charts
      chart: gha-runner-scale-set
      targetRevision: 0.14.2
      helm:
        valueFiles:
          - $values/projects/golfapp-arc-runner-values.yaml
    # Literal, not __GIT_REPO_URL__/__GIT_REVISION__ - those macros are
    # only substituted by Pulumi for the two specific files it reads
    # directly (bootstrap/argocd/{root-app,projects-root}.yaml). Files
    # under projects/ are picked up by ArgoCD itself via projects-root,
    # never templated by Pulumi - see projects/golfapp-appset.yaml's own
    # first Application for the same reason it uses a literal repoURL.
    - repoURL: https://github.com/atidyshirt/home-server.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true
