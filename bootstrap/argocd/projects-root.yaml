apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: projects-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: __GIT_REPO_URL__
    targetRevision: __GIT_REVISION__
    path: projects
    directory:
      recurse: false
      include: '*-appset.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true
