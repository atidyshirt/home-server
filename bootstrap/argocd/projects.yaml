apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Core cluster infrastructure addons - one appset per namespace
  sourceRepos:
    - __GIT_REPO_URL__
  destinations:
    - server: https://kubernetes.default.svc
      namespace: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: golf-application
  namespace: argocd
spec:
  description: golf-application
  sourceRepos:
    - https://github.com/atidyshirt/golfapp-platform
  destinations:
    - server: https://kubernetes.default.svc
      namespace: golf
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: golfapp-preview
  namespace: argocd
spec:
  description: Per-PR golfapp preview environments (ATI-82) - one namespace per open, labeled PR
  sourceRepos:
    - https://github.com/atidyshirt/golfapp-platform
  destinations:
    - server: https://kubernetes.default.svc
      namespace: 'golf-pr-*'
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
