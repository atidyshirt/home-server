apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Core cluster infrastructure addons - one appset per namespace
  sourceRepos:
    - __GIT_REPO_URL__
  destinations:
    - server: https://kubernetes.default.svc
      namespace: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: golf-application
  namespace: argocd
spec:
  description: golf-application
  # Not __GIT_REPO_URL__ (that macro means home-server's own repo) - golf's
  # deploy manifests live in a separate repo, per the app-template/
  # deploy-template split (see projects/golfapp-appset.yaml).
  sourceRepos:
    - https://github.com/atidyshirt/golfapp-platform
  destinations:
    - server: https://kubernetes.default.svc
      namespace: golf
